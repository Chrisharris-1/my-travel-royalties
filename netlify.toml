[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Clean, friendly API paths -> the actual function files.
[[redirects]]
  from = "/api/offer-requests"
  to = "/.netlify/functions/offer-requests"
  status = 200

